name: Format branch once

on:
  push:
    branches: ["fix/stabilize-production-foundation"]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format the two CI-failing files
        run: npx prettier --write src/features/store/app-store.tsx src/routes/match.tsx

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/store/app-store.tsx src/routes/match.tsx
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format CI-blocking files [skip-format]"
          git push origin HEAD:${{ github.ref_name }}
