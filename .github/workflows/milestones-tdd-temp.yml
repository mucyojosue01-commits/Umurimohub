name: Temporary Milestones Verification

on:
  push:
    branches: ["feat/milestones-phase-b"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://ci-placeholder.invalid
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/milestones src/routes/dashboard.tsx src/integrations/supabase/types.ts src/test/milestones.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/milestones src/routes/dashboard.tsx src/integrations/supabase/types.ts src/test/milestones.test.ts
            git commit -m "style: format Milestones Phase B files"
            git push
          fi
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build
