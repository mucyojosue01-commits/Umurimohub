name: Bootstrap production dependencies

on:
  push:
    branches: ["fix/stabilize-production-foundation"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npx prettier --write .

      - name: Commit reproducibility and formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json . ':(exclude).github/workflows/bootstrap.yml'
          if git diff --cached --quiet; then
            echo "No bootstrap changes needed."
            exit 0
          fi
          git commit -m "chore: make CI reproducible and format source"
          git push origin HEAD:${{ github.ref_name }}
