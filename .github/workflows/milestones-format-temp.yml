name: Temporary Milestones Format Fix

on:
  push:
    branches: ["feat/milestones-phase-b"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/superpowers/plans/2026-10-07-milestones-phase-b.md
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/superpowers/plans/2026-10-07-milestones-phase-b.md
            git commit -m "style: format Milestones Phase B plan"
            git push
          fi
