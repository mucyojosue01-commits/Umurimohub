name: Format contracts implementation
on:
  push:
    branches: ["feat/contracts-workflow-final"]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/superpowers/plans/2026-10-07-contracts-workflow.md docs/superpowers/specs/2026-10-07-contracts-workflow-design.md src/features/contracts/panels.tsx src/features/contracts/service.ts src/integrations/supabase/previewAuthStorage.ts src/integrations/supabase/types.ts src/test/contracts.test.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: contracts-formatted
          path: |
            docs/superpowers/plans/2026-10-07-contracts-workflow.md
            docs/superpowers/specs/2026-10-07-contracts-workflow-design.md
            src/features/contracts/panels.tsx
            src/features/contracts/service.ts
            src/integrations/supabase/previewAuthStorage.ts
            src/integrations/supabase/types.ts
            src/test/contracts.test.ts
