name: Temporary format fix
on:
  push:
    branches:
      - feat/live-production-hardening
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/data/catalog.ts src/features/messaging/service.ts src/features/store/app-store.tsx src/integrations/supabase/types.ts src/routes/businesses.tsx src/routes/company.tsx src/routes/dashboard.tsx src/routes/grow.tsx src/routes/messages.tsx src/routes/notifications.tsx src/routes/teams.index.tsx src/routes/workers.index.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format live production hardening"
          git push
