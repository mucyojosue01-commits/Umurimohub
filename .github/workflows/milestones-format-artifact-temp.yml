name: Temporary Milestones Format Artifact

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/superpowers/plans/2026-10-07-milestones-phase-b.md
      - uses: actions/upload-artifact@v4
        with:
          name: milestones-plan-prettier
          path: docs/superpowers/plans/2026-10-07-milestones-phase-b.md
